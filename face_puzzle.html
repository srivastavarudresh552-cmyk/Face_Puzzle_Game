<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Face Puzzle Game</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #5a4bd1 100%);
    color: #222;
  }
  .app {
    max-width: 640px; margin: 0 auto; padding: 20px 16px 60px;
    display: flex; flex-direction: column; align-items: center;
  }
  .title {
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.25);
    font-size: 28px; margin: 8px 0 20px; text-align: center;
  }
  .screen { display: none; width: 100%; }
  .screen.active { display: block; }
  .card {
    background: #fff; border-radius: 20px; padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25); width: 100%;
  }
  .video-wrap {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: #000; border-radius: 14px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .camera-loading, .camera-error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 14px; text-align: center; padding: 0 20px;
  }
  .camera-error { background: rgba(0,0,0,.6); padding: 16px; border-radius: 10px; max-width: 85%; }
  .hidden { display: none !important; }
  .controls { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, #6c5ce7, #5a4bd1); color: #fff;
    box-shadow: 0 6px 16px rgba(108,92,231,.4);
  }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-secondary { background: #f1f0fb; color: #4b3fbd; }
  .btn-secondary:hover { background: #e6e4f9; }
  .diff-btn { background: #f1f0fb; color: #333; min-width: 70px; }
  .diff-btn.selected { background: linear-gradient(135deg, #6c5ce7, #5a4bd1); color: #fff; }
  .difficulty-picker { margin-top: 18px; text-align: center; font-weight: 600; color: #444; }
  .diff-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  #preview-canvas { width: 100%; border-radius: 14px; display: block; }
  .stats-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .stat { flex: 1; background: #f7f6fd; border-radius: 12px; padding: 10px; text-align: center; }
  .stat-label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { display: block; font-size: 18px; font-weight: 700; color: #3b3267; margin-top: 2px; }
  .puzzle-container {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: #222; border-radius: 14px; overflow: hidden; margin: 0 auto;
  }
  .piece {
    position: absolute; border: 3px solid transparent; background-repeat: no-repeat;
    box-sizing: border-box; cursor: grab; user-select: none; -webkit-user-drag: none;
    touch-action: none; transition: left .25s ease, top .25s ease, box-shadow .2s;
  }
  .piece.dragging {
    cursor: grabbing; border-color: #ff7043; box-shadow: 0 10px 25px rgba(0,0,0,.4); z-index: 50;
  }
  .piece.correct { border-color: #2ecc71; }
  .overlay {
    position: fixed; inset: 0; background: rgba(20,15,40,.75);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .overlay-card {
    background: #fff; border-radius: 20px; padding: 28px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .overlay-card h2 { margin-top: 0; color: #3b3267; }
  .result-stats { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0; }
  .leaderboard-card { margin-top: 18px; background: #f7f6fd; border-radius: 14px; padding: 14px; text-align: left; }
  .leaderboard-card h3 { margin: 0 0 10px; font-size: 14px; color: #555; text-transform: uppercase; letter-spacing: .5px; }
  .leaderboard-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .leaderboard-list li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e6e4f9; color: #444; }
  .leaderboard-list li:last-child { border-bottom: none; }
  .leaderboard-empty { font-size: 13px; color: #888; text-align: center; padding: 6px 0; }
  @media (max-width: 480px) {
    .title { font-size: 22px; }
    .stat-value { font-size: 15px; }
    .btn { padding: 10px 16px; font-size: 14px; }
    .card { padding: 14px; }
  }
</style>
</head>
<body>
  <div class="app">
    <h1 class="title">🧩 Face Puzzle</h1>

    <section id="screen-camera" class="screen active">
      <div class="card">
        <div class="video-wrap">
          <video id="video" autoplay playsinline muted></video>
          <div id="camera-loading" class="camera-loading">Requesting camera access…</div>
          <div id="camera-error" class="camera-error hidden"></div>
        </div>
        <div class="controls">
          <button id="btn-take-photo" class="btn btn-primary" disabled>📸 Take Photo</button>
          <button id="btn-retry-camera" class="btn btn-secondary hidden">🔄 Retry Camera</button>
        </div>
      </div>
      <div id="leaderboard-camera" class="leaderboard-card"></div>
    </section>

    <section id="screen-preview" class="screen">
      <div class="card">
        <canvas id="preview-canvas"></canvas>
        <div class="difficulty-picker">
          <span>Choose difficulty:</span>
          <div class="diff-buttons">
            <button class="btn diff-btn" data-size="3">3 × 3</button>
            <button class="btn diff-btn" data-size="4">4 × 4</button>
            <button class="btn diff-btn" data-size="5">5 × 5</button>
          </div>
        </div>
        <div class="controls">
          <button id="btn-retake" class="btn btn-secondary">↺ Retake Photo</button>
          <button id="btn-start-puzzle" class="btn btn-primary" disabled>▶ Start Puzzle</button>
        </div>
      </div>
    </section>

    <section id="screen-puzzle" class="screen">
      <div class="card">
        <div class="stats-bar">
          <div class="stat"><span class="stat-label">Time</span><span id="stat-time" class="stat-value">00:00.0</span></div>
          <div class="stat"><span class="stat-label">Moves</span><span id="stat-moves" class="stat-value">0</span></div>
          <div class="stat"><span class="stat-label">Correct</span><span id="stat-correct" class="stat-value">0 / 0</span></div>
        </div>
        <div id="puzzle-container" class="puzzle-container"></div>
        <div class="controls">
          <button id="btn-new-photo" class="btn btn-secondary">📷 New Photo</button>
          <button id="btn-shuffle" class="btn btn-secondary">🔀 Restart Puzzle</button>
        </div>
      </div>
    </section>
  </div>

  <div id="win-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>🎉 Puzzle Solved!</h2>
      <div class="result-stats">
        <div class="stat"><span class="stat-label">Final Time</span><span id="result-time" class="stat-value"></span></div>
        <div class="stat"><span class="stat-label">Moves</span><span id="result-moves" class="stat-value"></span></div>
        <div class="stat"><span class="stat-label">Difficulty</span><span id="result-difficulty" class="stat-value"></span></div>
      </div>
      <div id="leaderboard-win" class="leaderboard-card"></div>
      <div class="controls">
        <button id="btn-play-again" class="btn btn-primary">🔁 Play Again</button>
        <button id="btn-overlay-new-photo" class="btn btn-secondary">📷 New Photo</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const video = document.getElementById('video');
  const cameraLoading = document.getElementById('camera-loading');
  const cameraError = document.getElementById('camera-error');
  const takePhotoBtn = document.getElementById('btn-take-photo');
  const retryCameraBtn = document.getElementById('btn-retry-camera');
  const leaderboardCameraEl = document.getElementById('leaderboard-camera');

  const previewCanvas = document.getElementById('preview-canvas');
  const retakeBtn = document.getElementById('btn-retake');
  const startPuzzleBtn = document.getElementById('btn-start-puzzle');
  const diffButtons = document.querySelectorAll('.diff-btn');

  const statTime = document.getElementById('stat-time');
  const statMoves = document.getElementById('stat-moves');
  const statCorrect = document.getElementById('stat-correct');
  const puzzleContainer = document.getElementById('puzzle-container');
  const newPhotoBtn = document.getElementById('btn-new-photo');
  const shuffleBtn = document.getElementById('btn-shuffle');

  const winOverlay = document.getElementById('win-overlay');
  const resultTime = document.getElementById('result-time');
  const resultMoves = document.getElementById('result-moves');
  const resultDifficulty = document.getElementById('result-difficulty');
  const leaderboardWinEl = document.getElementById('leaderboard-win');
  const playAgainBtn = document.getElementById('btn-play-again');
  const overlayNewPhotoBtn = document.getElementById('btn-overlay-new-photo');

  let stream = null;
  let capturedDataURL = null;
  let gridSize = 3;
  let pieces = [];
  let total = 0;
  let movesCount = 0;
  let timerInterval = null;
  let startTimeMs = 0;
  let finalElapsedMs = 0;
  let activeDrag = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function initCamera() {
    cameraError.classList.add('hidden');
    cameraLoading.classList.remove('hidden');
    takePhotoBtn.disabled = true;
    retryCameraBtn.classList.add('hidden');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraLoading.classList.add('hidden');
      cameraError.textContent = 'Camera access is not supported in this browser, or this page is not served over HTTPS/localhost.';
      cameraError.classList.remove('hidden');
      retryCameraBtn.classList.remove('hidden');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      video.play().catch(() => {});

      function markReady() {
        cameraLoading.classList.add('hidden');
        takePhotoBtn.disabled = false;
      }
      if (video.readyState >= 1) {
        markReady();
      } else {
        video.addEventListener('loadedmetadata', markReady, { once: true });
      }
    } catch (err) {
      cameraLoading.classList.add('hidden');
      let msg = 'Unable to access camera.';
      if (err && err.name) {
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg = 'Camera permission was denied. Please allow camera access in your browser settings and try again.';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg = 'No camera was found on this device.';
        } else if (err.name === 'NotReadableError') {
          msg = 'Your camera is already in use by another application.';
        } else if (err.name === 'OverconstrainedError') {
          msg = 'No camera matches the requested settings.';
        } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
          msg = 'Camera access requires HTTPS or localhost.';
        }
      }
      cameraError.textContent = msg;
      cameraError.classList.remove('hidden');
      retryCameraBtn.classList.remove('hidden');
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  takePhotoBtn.addEventListener('click', () => {
    if (!video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    const side = Math.min(vw, vh);
    const sx = (vw - side) / 2, sy = (vh - side) / 2;
    const outSize = Math.min(side, 800);
    const canvas = document.createElement('canvas');
    canvas.width = outSize;
    canvas.height = outSize;
    const ctx = canvas.getContext('2d');
    ctx.translate(outSize, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, side, side, 0, 0, outSize, outSize);
    capturedDataURL = canvas.toDataURL('image/jpeg', 0.92);
    stopCamera();
    showPreview();
  });

  function showPreview() {
    const pctx = previewCanvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      previewCanvas.width = img.width;
      previewCanvas.height = img.height;
      pctx.drawImage(img, 0, 0);
    };
    img.src = capturedDataURL;
    gridSize = 0;
    startPuzzleBtn.disabled = true;
    diffButtons.forEach(b => b.classList.remove('selected'));
    showScreen('screen-preview');
  }

  diffButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      diffButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      gridSize = parseInt(btn.dataset.size, 10);
      startPuzzleBtn.disabled = false;
    });
  });

  retakeBtn.addEventListener('click', () => {
    capturedDataURL = null;
    showScreen('screen-camera');
    initCamera();
  });

  startPuzzleBtn.addEventListener('click', () => {
    buildPuzzle();
    showScreen('screen-puzzle');
  });

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function isIdentity(arr) { return arr.every((v, i) => v === i); }
  function isSufficientlyShuffled(arr) {
    const displaced = arr.filter((v, i) => v !== i).length;
    return displaced >= Math.max(2, Math.floor(arr.length * 0.6));
  }

  function buildPuzzle() {
    total = gridSize * gridSize;
    let order = [...Array(total).keys()];
    do {
      shuffleArray(order);
    } while (isIdentity(order) || !isSufficientlyShuffled(order));

    pieces = order.map((currentIndex, i) => ({ correctIndex: i, currentIndex, el: null }));
    movesCount = 0;
    statMoves.textContent = '0';
    renderPuzzle();
    startTimer();
  }

  function renderPuzzle() {
    puzzleContainer.innerHTML = '';
    const w = 100 / gridSize;
    pieces.forEach((piece, idx) => {
      const el = document.createElement('div');
      el.className = 'piece';
      el.dataset.idx = idx;
      el.style.width = w + '%';
      el.style.height = w + '%';

      const correctRow = Math.floor(piece.correctIndex / gridSize);
      const correctCol = piece.correctIndex % gridSize;
      el.style.backgroundImage = `url(${capturedDataURL})`;
      el.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
      const posX = gridSize === 1 ? 0 : (correctCol / (gridSize - 1)) * 100;
      const posY = gridSize === 1 ? 0 : (correctRow / (gridSize - 1)) * 100;
      el.style.backgroundPosition = `${posX}% ${posY}%`;

      positionPieceEl(el, piece.currentIndex);
      el.addEventListener('pointerdown', onPointerDown);
      piece.el = el;
      puzzleContainer.appendChild(el);
    });
    updateStats();
  }

  function positionPieceEl(el, currentIndex) {
    const row = Math.floor(currentIndex / gridSize);
    const col = currentIndex % gridSize;
    const w = 100 / gridSize;
    el.style.left = (col * w) + '%';
    el.style.top = (row * w) + '%';
  }

  function positionPiece(piece) { positionPieceEl(piece.el, piece.currentIndex); }

  function onPointerDown(e) {
    e.preventDefault();
    const el = e.currentTarget;
    const idx = parseInt(el.dataset.idx, 10);
    const piece = pieces[idx];
    const containerRect = puzzleContainer.getBoundingClientRect();
    const pieceRect = el.getBoundingClientRect();

    activeDrag = {
      piece,
      el,
      grabX: e.clientX - pieceRect.left,
      grabY: e.clientY - pieceRect.top,
      cellPx: containerRect.width / gridSize,
      containerRect,
      lastLeftPx: pieceRect.left - containerRect.left,
      lastTopPx: pieceRect.top - containerRect.top
    };

    el.classList.add('dragging');
    el.style.zIndex = '50';
    el.style.transition = 'none';

    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup', onPointerUp);
    el.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (!activeDrag) return;
    const { containerRect, cellPx, grabX, grabY, el } = activeDrag;
    let leftPx = e.clientX - containerRect.left - grabX;
    let topPx = e.clientY - containerRect.top - grabY;
    leftPx = Math.max(0, Math.min(leftPx, containerRect.width - cellPx));
    topPx = Math.max(0, Math.min(topPx, containerRect.height - cellPx));
    activeDrag.lastLeftPx = leftPx;
    activeDrag.lastTopPx = topPx;
    el.style.left = (leftPx / containerRect.width * 100) + '%';
    el.style.top = (topPx / containerRect.height * 100) + '%';
  }

  function onPointerUp(e) {
    if (!activeDrag) return;
    const { piece, el, cellPx, containerRect, lastLeftPx, lastTopPx } = activeDrag;

    el.removeEventListener('pointermove', onPointerMove);
    el.removeEventListener('pointerup', onPointerUp);
    el.removeEventListener('pointercancel', onPointerUp);
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}

    el.classList.remove('dragging');
    el.style.zIndex = '';
    el.style.transition = '';

    const centerX = lastLeftPx + cellPx / 2;
    const centerY = lastTopPx + cellPx / 2;
    let col = Math.floor(centerX / cellPx);
    let row = Math.floor(centerY / cellPx);
    col = Math.max(0, Math.min(col, gridSize - 1));
    row = Math.max(0, Math.min(row, gridSize - 1));
    const targetIndex = row * gridSize + col;

    if (targetIndex !== piece.currentIndex) {
      const occupant = pieces.find(p => p.currentIndex === targetIndex);
      if (occupant) {
        occupant.currentIndex = piece.currentIndex;
        piece.currentIndex = targetIndex;
        positionPiece(occupant);
      } else {
        piece.currentIndex = targetIndex;
      }
      movesCount++;
      statMoves.textContent = String(movesCount);
    }

    positionPiece(piece);
    updateStats();
    checkWin();
    activeDrag = null;
  }

  function updateStats() {
    let correctCount = 0;
    pieces.forEach(p => {
      const isCorrect = p.currentIndex === p.correctIndex;
      p.el.classList.toggle('correct', isCorrect);
      if (isCorrect) correctCount++;
    });
    statCorrect.textContent = `${correctCount} / ${total}`;
  }

  function checkWin() {
    const allCorrect = pieces.every(p => p.currentIndex === p.correctIndex);
    if (allCorrect) winGame();
  }

  function startTimer() {
    startTimeMs = performance.now();
    statTime.textContent = '00:00.0';
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = performance.now() - startTimeMs;
      statTime.textContent = formatTime(elapsed);
    }, 100);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function formatTime(ms) {
    const totalDeci = Math.floor(ms / 100);
    const minutes = Math.floor(totalDeci / 600);
    const seconds = Math.floor((totalDeci % 600) / 10);
    const deci = totalDeci % 10;
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${deci}`;
  }

  function winGame() {
    finalElapsedMs = performance.now() - startTimeMs;
    stopTimer();
    statTime.textContent = formatTime(finalElapsedMs);
    resultTime.textContent = formatTime(finalElapsedMs);
    resultMoves.textContent = String(movesCount);
    resultDifficulty.textContent = `${gridSize} × ${gridSize}`;
    saveScore();
    renderLeaderboard(leaderboardWinEl);
    winOverlay.classList.remove('hidden');
  }

  function saveScore() {
    let scores = [];
    try { scores = JSON.parse(localStorage.getItem('facePuzzleLeaderboard')) || []; } catch (e) { scores = []; }
    scores.push({
      date: new Date().toLocaleDateString(),
      time: finalElapsedMs,
      moves: movesCount,
      difficulty: `${gridSize}×${gridSize}`
    });
    scores.sort((a, b) => a.time - b.time);
    scores = scores.slice(0, 5);
    localStorage.setItem('facePuzzleLeaderboard', JSON.stringify(scores));
  }

  function renderLeaderboard(container) {
    let scores = [];
    try { scores = JSON.parse(localStorage.getItem('facePuzzleLeaderboard')) || []; } catch (e) { scores = []; }
    if (scores.length === 0) {
      container.innerHTML = '<h3>🏆 Best Times</h3><div class="leaderboard-empty">No scores yet — be the first!</div>';
      return;
    }
    const items = scores.map((s, i) =>
      `<li><span>#${i + 1} ${formatTime(s.time)}</span><span>${s.difficulty} · ${s.moves} mv · ${s.date}</span></li>`
    ).join('');
    container.innerHTML = `<h3>🏆 Best Times</h3><ul class="leaderboard-list">${items}</ul>`;
  }

  function goToNewPhoto() {
    stopTimer();
    winOverlay.classList.add('hidden');
    capturedDataURL = null;
    showScreen('screen-camera');
    initCamera();
  }

  retryCameraBtn.addEventListener('click', initCamera);
  newPhotoBtn.addEventListener('click', goToNewPhoto);
  overlayNewPhotoBtn.addEventListener('click', goToNewPhoto);
  shuffleBtn.addEventListener('click', () => { buildPuzzle(); });
  playAgainBtn.addEventListener('click', () => {
    winOverlay.classList.add('hidden');
    buildPuzzle();
    showScreen('screen-puzzle');
  });

  renderLeaderboard(leaderboardCameraEl);
  showScreen('screen-camera');
  initCamera();
})();
</script>
</body>
</html>
